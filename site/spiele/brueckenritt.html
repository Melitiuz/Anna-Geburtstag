<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Brückenritt</title>
  <link rel="stylesheet" href="../css/stil.css">
  <style>
    .buehne {
      width: 100%; max-width: 560px; margin: 0 auto;
      border-radius: var(--radius); overflow: hidden; border: 3px solid var(--akzent);
      touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
      background: #9fd8ff;
    }
    .buehne canvas { display: block; width: 100%; touch-action: none; }
    #meldung { min-height: 1.5em; font-weight: 600; text-align: center; margin-top: 12px; }
    .steuerung { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
    .steuerung .knopf { min-height: 64px; font-size: 1.4rem; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <main class="seite">
    <a class="zurueck" href="../index.html">‹ Übersicht</a>
    <header class="kopf">
      <h1><span class="titel-icon" data-icon="brueckenritt"></span> Brückenritt</h1>
      <p class="unterzeile">Der Ritter jagt zur Burg, doch davor liegt ein Burggraben. Sammle unterwegs Holz für die Brücke.</p>
    </header>
    <div class="buehne" id="buehne"><canvas id="leinwand"></canvas></div>
    <p id="meldung" aria-live="polite"></p>
    <div class="steuerung"><button class="knopf" type="button" id="aktion">Losreiten</button></div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/motive.js"></script>
  <script src="../js/fortschritt.js"></script>
  <script>
    (function () {
      // Virtuelles Spielfeld, wird auf die Bildschirmbreite skaliert
      var W = 400, H = 225, BODEN = 190, RX = 70, GRABEN_SCHIRM = 190;
      var HOLZ_GESAMT = 30, HOLZ_NOETIG = 24, VERLUST = 3;
      var GRAVITATION = 1700, SPRUNG = -650, ABBRUCH = 0.35;   // Loslassen bremst den Aufstieg: kurzer Tipp = kleiner Sprung
      var TEMPO_START = 280, TEMPO_ENDE = 430;
      var AST_UNTEN = BODEN - 46, RABE_Y = BODEN - 56;
      var HOLZ_BODEN = BODEN - 16, HOLZ_NIEDRIG = BODEN - 50, HOLZ_HOCH = BODEN - 95, HOLZ_GANZ_HOCH = BODEN - 112;

      var buehne = document.getElementById("buehne");
      var leinwand = document.getElementById("leinwand");
      var g = leinwand.getContext("2d");
      var meldung = document.getElementById("meldung");
      var knopf = document.getElementById("aktion");

      function bildAus(svg) {
        var img = new Image();
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        return img;
      }
      // Der Ritter aus dem Finale, aber ohne Beine und Schatten: die Beine werden beim Galopp einzeln bewegt
      var koerperBild = bildAus(Motive.MOTIVE.ritter.zeichnen("rechts")
        .replace(/<rect x="\d+" y="(?:64|66|89)"[^>]*\/>/g, "")
        .replace(/<ellipse cx="50" cy="95"[^>]*\/>/, ""));
      var burgBild = bildAus(Motive.MOTIVE.burg.svg);
      // Beine in den Koordinaten des Motivs (100 x 100), hintere zuerst
      var BEINE = [
        { x: 41, y: 66, l: 26, farbe: "#6a3f25", vorn: false, versatz: 0.8 },
        { x: 61, y: 66, l: 26, farbe: "#6a3f25", vorn: true, versatz: 0.8 },
        { x: 31, y: 64, l: 28, farbe: "#7a4b2e", vorn: false, versatz: 0 },
        { x: 70, y: 64, l: 28, farbe: "#7a4b2e", vorn: true, versatz: 0 }
      ];

      var skala = 1, phase, welt, kamera, reiter, holz, unverwundbar, teile, texte, staub, funken, wackeln, blitz,
          grabenX, bauFortschritt, letzteZeit, gedrueckt, sprungPuffer, zeit, laufPhase, treffer;

      function vermessen() {
        var dpr = window.devicePixelRatio || 1;
        var breite = buehne.clientWidth;
        skala = breite / W;
        leinwand.width = Math.round(breite * dpr);
        leinwand.height = Math.round(H * skala * dpr);
        leinwand.style.height = H * skala + "px";
        g.setTransform(dpr * skala, 0, 0, dpr * skala, 0, 0);
      }

      function zufall(a, b) { return a + Math.random() * (b - a); }
      function tempoBei(x) { return TEMPO_START + (TEMPO_ENDE - TEMPO_START) * Math.min(1, x / grabenX); }
      // Feste Pseudozufallszahl je Index: Hintergrund sieht abwechslungsreich aus, flackert aber nicht
      function rausch(n) { var s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

      // Gegner verhalten sich nicht immer gleich: Wölfe laufen verschieden schnell und manche springen plötzlich hoch,
      // manche Raben stoßen im Sturzflug herab. Ab welchem Abstand das passiert, wird zufällig festgelegt.
      function wolfNeu(x) { return { art: "wolf", x: x, w: 36, h: 22, vx: -zufall(60, 140), springt: Math.random() < 0.5 ? zufall(50, 140) : 0 }; }
      function rabeNeu(x) { return { art: "rabe", x: x, w: 28, vx: -70, sturz: Math.random() < 0.5 ? zufall(120, 260) : 0 }; }

      // ---------- Strecke aus Mustern ----------
      // Jedes Muster legt Hindernisse und Hölzer ab und gibt zurück, wie viel Holz und Platz es belegt.
      var MUSTER = {
        stein: function (x, l) { l.push({ art: "stein", x: x, w: 30, h: 24 }); return { holz: 0, breite: 30 }; },
        steinMitHolz: function (x, l) { l.push({ art: "stein", x: x, w: 30, h: 24 }); l.push({ art: "holz", x: x + 2, y: HOLZ_NIEDRIG }); return { holz: 1, breite: 30 }; },
        doppelstein: function (x, l) { l.push({ art: "stein", x: x, w: 26, h: 22 }); l.push({ art: "stein", x: x + 60, w: 26, h: 22 }); return { holz: 0, breite: 86 }; },
        wolf: function (x, l) { l.push(wolfNeu(x + 120)); return { holz: 0, breite: 40 }; },
        wolfPaar: function (x, l) { l.push(wolfNeu(x + 120)); l.push(wolfNeu(x + 185)); return { holz: 0, breite: 110 }; },
        fass: function (x, l) { l.push({ art: "fass", x: x + 150, w: 24, h: 24, vx: -zufall(90, 230) }); return { holz: 0, breite: 40 }; },
        hecke: function (x, l) { l.push({ art: "hecke", x: x, w: 34, h: 80 }); return { holz: 0, breite: 34 }; },
        heckeMitHolz: function (x, l) { l.push({ art: "hecke", x: x, w: 34, h: 80 }); l.push({ art: "holz", x: x + 4, y: HOLZ_GANZ_HOCH }); return { holz: 1, breite: 34 }; },
        ast: function (x, l) { l.push({ art: "ast", x: x, w: 70 }); l.push({ art: "holz", x: x + 22, y: HOLZ_BODEN }); return { holz: 1, breite: 70 }; },
        steinAst: function (x, l) {
          // Kleiner Sprung über den Stein, dann sofort unten bleiben: dahinter hängt ein Ast
          var abstand = 30 + tempoBei(x) * 0.62;
          l.push({ art: "stein", x: x, w: 28, h: 22 }); l.push({ art: "ast", x: x + abstand, w: 70 }); l.push({ art: "holz", x: x + abstand + 22, y: HOLZ_BODEN });
          return { holz: 1, breite: abstand + 70 };
        },
        // Ein Rabe fliegt in Kopfhöhe heran: unten bleiben (oder ganz hoch springen)
        rabe: function (x, l) { l.push(rabeNeu(x + 110)); l.push({ art: "holz", x: x + 30, y: HOLZ_BODEN }); return { holz: 1, breite: 60 }; },
        // Ein Rabe schwebt über dem Stein: ein kleiner Sprung reicht nicht, nur ein hoher
        steinRabe: function (x, l) {
          l.push({ art: "stein", x: x, w: 28, h: 22 }); l.push({ art: "rabe", x: x, w: 28, vx: 0 });
          l.push({ art: "holz", x: x + 2, y: HOLZ_GANZ_HOCH });
          return { holz: 1, breite: 30 };
        },
        grube: function (x, l) { l.push({ art: "grube", x: x, w: 90 }); l.push({ art: "holz", x: x + 32, y: HOLZ_NIEDRIG }); return { holz: 1, breite: 90 }; },
        grubeRabe: function (x, l) { l.push({ art: "grube", x: x, w: 84 }); l.push({ art: "rabe", x: x + 28, w: 28, vx: 0 }); return { holz: 0, breite: 84 }; },
        // Kombinationen ohne Verschnaufpause
        grubeHecke: function (x, l) { l.push({ art: "grube", x: x, w: 80 }); l.push({ art: "hecke", x: x + 115, w: 34, h: 80 }); return { holz: 0, breite: 149 }; },
        steinGrube: function (x, l) {
          var abstand = 28 + tempoBei(x) * 0.55;
          l.push({ art: "stein", x: x, w: 28, h: 22 }); l.push({ art: "grube", x: x + abstand, w: 80 }); l.push({ art: "holz", x: x + abstand + 28, y: HOLZ_NIEDRIG });
          return { holz: 1, breite: abstand + 80 };
        },
        rabenPaar: function (x, l) {
          l.push(rabeNeu(x + 110)); l.push(rabeNeu(x + 160));
          l.push({ art: "holz", x: x + 20, y: HOLZ_BODEN }); l.push({ art: "holz", x: x + 70, y: HOLZ_BODEN });
          return { holz: 2, breite: 90 };
        },
        astWolf: function (x, l) { l.push({ art: "ast", x: x, w: 70 }); l.push(wolfNeu(x + 230)); return { holz: 0, breite: 110 }; },
        holzVorStein: function (x, l) { l.push({ art: "holz", x: x, y: HOLZ_BODEN }); l.push({ art: "stein", x: x + 44, w: 28, h: 22 }); return { holz: 1, breite: 72 }; },
        // Ein hoher Sprung über beide Steine, das Holz schwebt genau dazwischen
        doppelsteinHolz: function (x, l) {
          l.push({ art: "stein", x: x, w: 26, h: 22 }); l.push({ art: "holz", x: x + 44, y: HOLZ_HOCH }); l.push({ art: "stein", x: x + 92, w: 26, h: 22 });
          return { holz: 1, breite: 118 };
        },
        // Drei Hölzer im Bogen über einer Grube: nur mit genau passendem Sprung alle zu erwischen
        grubeBogen: function (x, l) {
          l.push({ art: "grube", x: x, w: 96 });
          l.push({ art: "holz", x: x + 6, y: BODEN - 40 }); l.push({ art: "holz", x: x + 40, y: BODEN - 62 }); l.push({ art: "holz", x: x + 74, y: BODEN - 40 });
          return { holz: 3, breite: 106 };
        }
      };
      var GEWICHTE = {
        stein: 2, steinMitHolz: 3, doppelstein: 3, wolf: 2, wolfPaar: 2, fass: 2, hecke: 2, heckeMitHolz: 3, ast: 2, steinAst: 3,
        rabe: 2, steinRabe: 3, grube: 3, grubeRabe: 2, grubeHecke: 2, steinGrube: 2, rabenPaar: 2, astWolf: 2,
        holzVorStein: 2, doppelsteinHolz: 2, grubeBogen: 2
      };

      function probeHolz(name) { return MUSTER[name](0, []).holz; }
      function musterWaehlen(rest) {
        var namen = Object.keys(GEWICHTE).filter(function (n) { return probeHolz(n) <= rest; });
        var summe = namen.reduce(function (s, n) { return s + GEWICHTE[n]; }, 0), z = Math.random() * summe;
        for (var i = 0; i < namen.length; i++) { z -= GEWICHTE[namen[i]]; if (z <= 0) return namen[i]; }
        return namen[namen.length - 1];
      }

      // Zwei Durchgänge: Der erste schätzt die Streckenlänge, damit im zweiten das Tempo an jeder Stelle stimmt
      // (Abstände hängen vom Tempo ab, das Tempo von der Gesamtlänge).
      function streckeBauen() {
        var schaetzung = 8000, liste, x;
        for (var durchgang = 0; durchgang < 2; durchgang++) {
          grabenX = schaetzung;
          liste = []; x = 380;
          var holzZahl = 0, letztes = "";
          while (holzZahl < HOLZ_GESAMT) {
            var name = musterWaehlen(HOLZ_GESAMT - holzZahl);
            if (name === letztes && Math.random() < 0.7) name = musterWaehlen(HOLZ_GESAMT - holzZahl);
            var e = MUSTER[name](x, liste);
            holzZahl += e.holz;
            letztes = name;
            // Abstand zum nächsten Muster: knapp genug Zeit für einen hohen Sprung plus Reaktion
            x += e.breite + tempoBei(x) * zufall(0.6, 0.9);
          }
          schaetzung = x + 220;
        }
        grabenX = x + 220;
        return liste;
      }

      function neu() {
        welt = streckeBauen();
        kamera = 0;
        reiter = { y: BODEN, vy: 0, amBoden: true, x: RX, gebremst: false };
        holz = 0; unverwundbar = 0; teile = []; texte = []; staub = []; funken = []; wackeln = 0; blitz = 0;
        bauFortschritt = 0; gedrueckt = false; sprungPuffer = 0; zeit = 0; laufPhase = 0; treffer = 0;
        phase = "bereit";
        meldung.textContent = "";
        knopf.textContent = "Losreiten";
        knopf.hidden = false;
        zeichnen();
      }

      // ---------- Steuerung ----------
      function absprung() { reiter.vy = SPRUNG; reiter.amBoden = false; reiter.gebremst = false; sprungPuffer = 0; }

      function druecken() {
        gedrueckt = true;
        if (phase === "bereit") { phase = "laeuft"; Fortschritt.versuch("brueckenritt"); knopf.textContent = "Springen"; letzteZeit = performance.now(); requestAnimationFrame(schleife); return; }
        if (phase !== "laeuft") return;
        if (reiter.amBoden) absprung();
        else sprungPuffer = 0.12; // kurz vor der Landung gedrückt: springt sofort nach dem Aufsetzen
      }
      function loslassen() {
        gedrueckt = false;
        if (!reiter.amBoden && reiter.vy < 0 && !reiter.gebremst) { reiter.vy *= ABBRUCH; reiter.gebremst = true; }
      }

      buehne.addEventListener("pointerdown", function (e) { e.preventDefault(); druecken(); });
      window.addEventListener("pointerup", loslassen);
      window.addEventListener("pointercancel", loslassen);
      document.addEventListener("keydown", function (e) {
        if ((e.code === "Space" || e.code === "ArrowUp") && !e.repeat) { e.preventDefault(); druecken(); }
      });
      document.addEventListener("keyup", function (e) {
        if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); loslassen(); }
      });
      // Der Knopf unter dem Spielfeld: vor dem Start "Losreiten", während des Ritts "Springen"
      // (kurz drücken = kleiner Sprung, halten = hoher Sprung), nach einer Niederlage "Noch einmal"
      knopf.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        if (phase === "gescheitert") neu();
        druecken();
      });
      knopf.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      knopf.addEventListener("click", function (e) {
        // Nur für Tastaturbedienung (Enter), Maus und Finger laufen über pointerdown
        if (e.detail !== 0) return;
        if (phase === "gescheitert") neu();
        druecken();
        loslassen();
      });

      // ---------- Spiellogik ----------
      function trefferbox() { return { l: reiter.x + 15, r: reiter.x + 39, o: reiter.y - 40, u: reiter.y }; }
      function ueberlappt(a, b) { return a.l < b.r && a.r > b.l && a.o < b.u && a.u > b.o; }
      function box(e, sx) {
        if (e.art === "holz") return { l: sx, r: sx + 26, o: e.y - 8, u: e.y + 8 };
        if (e.art === "ast") return { l: sx + 4, r: sx + e.w - 4, o: 0, u: AST_UNTEN };
        if (e.art === "rabe") return { l: sx + 2, r: sx + e.w - 2, o: RABE_Y + (e.tief || 0) - 8, u: RABE_Y + (e.tief || 0) + 7 };
        if (e.art === "wolf") return { l: sx + 4, r: sx + e.w - 4, o: BODEN - e.h + 4 - (e.hoch || 0), u: BODEN - (e.hoch || 0) };
        // In die Grube fällt nur, wer mitten darin den Boden berührt
        if (e.art === "grube") return { l: sx + 16, r: sx + e.w - 16, o: BODEN - 3, u: BODEN + 20 };
        return { l: sx + 4, r: sx + e.w - 4, o: BODEN - e.h + 4, u: BODEN };
      }

      function schleife(jetzt) {
        var dt = Math.min(0.04, (jetzt - letzteZeit) / 1000);
        letzteZeit = jetzt;
        aktualisieren(dt);
        zeichnen();
        if (phase !== "fertig" && phase !== "gescheitert" && phase !== "bereit") requestAnimationFrame(schleife);
      }

      function getroffen() {
        var verlust = Math.min(VERLUST, holz);
        holz -= verlust;
        treffer++;
        unverwundbar = 1.1;
        wackeln = 0.35;
        blitz = 0.3;
        for (var i = 0; i < verlust; i++) teile.push({ x: reiter.x + 26, y: reiter.y - 30, vx: -60 - Math.random() * 140, vy: -260 - Math.random() * 160, leben: 1.1 });
        texte.push({ x: reiter.x + 20, y: reiter.y - 64, text: verlust ? "-" + verlust : "Autsch!", farbe: "#ff6b6b", leben: 0.9 });
        if (navigator.vibrate) navigator.vibrate(90);
      }

      function aktualisieren(dt) {
        zeit += dt;
        if (!reiter.amBoden) {
          reiter.vy += GRAVITATION * dt;
          reiter.y += reiter.vy * dt;
          if (reiter.y >= BODEN) {
            reiter.y = BODEN; reiter.vy = 0; reiter.amBoden = true;
            for (var d = 0; d < 6; d++) staub.push({ x: reiter.x + 10 + d * 6, y: BODEN - 2, vx: zufall(40, 160), leben: 0.5, r: zufall(2, 4) });
            if (sprungPuffer > 0 && phase === "laeuft") { absprung(); if (!gedrueckt) loslassen(); }
          }
        }
        if (sprungPuffer > 0) sprungPuffer -= dt;
        if (unverwundbar > 0) unverwundbar -= dt;
        if (wackeln > 0) wackeln -= dt;
        if (blitz > 0) blitz -= dt;
        teile.forEach(function (t) { t.vy += GRAVITATION * 0.6 * dt; t.x += t.vx * dt; t.y += t.vy * dt; t.leben -= dt; });
        teile = teile.filter(function (t) { return t.leben > 0; });
        funken.forEach(function (f) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 300 * dt; f.leben -= dt; });
        funken = funken.filter(function (f) { return f.leben > 0; });
        texte.forEach(function (t) { t.y -= 40 * dt; t.leben -= dt; });
        texte = texte.filter(function (t) { return t.leben > 0; });
        staub.forEach(function (s) { s.x -= s.vx * dt; s.y -= 12 * dt; s.leben -= dt; });
        staub = staub.filter(function (s) { return s.leben > 0; });

        if (phase === "laeuft") {
          var v = tempoBei(kamera);
          kamera += v * dt;
          laufPhase += v * dt / 15;
          if (reiter.amBoden && Math.random() < 0.5) staub.push({ x: reiter.x + 8, y: BODEN - 2, vx: v * 0.3, leben: 0.4, r: zufall(1.5, 3) });
          var b = trefferbox();
          welt.forEach(function (e) {
            if (e.weg) return;
            var sx = e.x - kamera;
            // Wölfe, Fässer und Raben setzen sich erst in Bewegung, wenn sie ins Bild kommen
            if (e.vx && sx < W + 40) { e.x += e.vx * dt; sx = e.x - kamera; }
            var vorRitter = sx - (reiter.x + 39);
            if (e.springt && e.hoch === undefined && vorRitter < e.springt) { e.hoch = 0; e.vy = -420; }
            if (e.hoch !== undefined && e.vy !== null) {
              e.vy += GRAVITATION * dt; e.hoch -= e.vy * dt;
              if (e.hoch <= 0) { e.hoch = 0; e.vy = null; }
            }
            if (e.sturz && e.sturzZeit === undefined && vorRitter < e.sturz) e.sturzZeit = 0;
            if (e.sturzZeit !== undefined && e.sturzZeit < 0.5) {
              e.sturzZeit += dt;
              e.tief = 38 * Math.sin(Math.PI * Math.min(1, e.sturzZeit / 0.5));
            }
            if (sx > W || sx < -100) return;
            if (e.art === "holz") {
              if (ueberlappt(b, box(e, sx))) {
                e.weg = true; holz++;
                texte.push({ x: sx, y: e.y - 12, text: "+1", farbe: "#ffe27a", leben: 0.7 });
                for (var f = 0; f < 7; f++) funken.push({ x: sx + 12, y: e.y, vx: zufall(-90, 90), vy: zufall(-150, -30), leben: zufall(0.3, 0.6) });
              }
            } else if (unverwundbar <= 0 && ueberlappt(b, box(e, sx))) {
              getroffen();
            }
          });
          if (kamera >= grabenX - GRABEN_SCHIRM) {
            kamera = grabenX - GRABEN_SCHIRM;
            if (reiter.amBoden) { phase = "ankunft"; knopf.hidden = true; meldung.textContent = "Der Burggraben! Jetzt wird gebaut."; }
          }
        } else if (phase === "ankunft") {
          reiter.x = Math.min(reiter.x + 90 * dt, GRABEN_SCHIRM - 54);
          laufPhase += 90 * dt / 12;
          if (reiter.x >= GRABEN_SCHIRM - 54) phase = "bauen";
        } else if (phase === "bauen") {
          var ziel = Math.min(holz, HOLZ_NOETIG);
          bauFortschritt = Math.min(ziel, bauFortschritt + dt * 14);
          if (bauFortschritt >= ziel) {
            if (holz >= HOLZ_NOETIG) { phase = "ueberqueren"; meldung.textContent = "Die Brücke steht!"; }
            else {
              phase = "gescheitert";
              meldung.textContent = "Nur " + holz + " von " + HOLZ_NOETIG + " Hölzern. Die Brücke ist zu kurz!";
              knopf.textContent = "Noch einmal";
              knopf.hidden = false;
            }
          }
        } else if (phase === "ueberqueren") {
          reiter.x += 90 * dt;
          laufPhase += 90 * dt / 12;
          if (reiter.x >= GRABEN_SCHIRM + 80) {
            phase = "fertig";
            meldung.textContent = "Der Ritter hat die Burg erreicht!";
            setTimeout(function () { Fortschritt.gewinnen("brueckenritt"); }, 500);
          }
        }
      }

      // ---------- Zeichnen ----------
      function farbe(hex) { var n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
      // Mischt zwei Farben: t = 0 Tag, t = 1 Abend

        landschaftZeichnen(t);
        bodenZeichnen(t);

        // Fahrtwind bei hohem Tempo
        if (v > 250) {
          g.strokeStyle = "rgba(255,255,255," + ((v - 250) / 200).toFixed(2) + ")"; g.lineWidth = 1.5;
          for (var s = 0; s < 6; s++) {
            var sy = 40 + ((s * 53) % 130), sxl = ((s * 131 - kamera * 1.6) % 460 + 460) % 460 - 30;
            g.beginPath(); g.moveTo(sxl, sy); g.lineTo(sxl + 26, sy); g.stroke();
          }
        }

        var gx = grabenX - kamera;
        if (gx < W + 200) grabenZeichnen(gx, t);

        // Gruben zuerst, damit alles andere darüber liegt
        welt.forEach(function (e) {
          if (e.weg || e.art !== "grube") return;
          var sx = e.x - kamera;
          if (sx > -110 && sx < W + 60) grubeZeichnen(e, sx);
        });
        welt.forEach(function (e) {
          if (e.weg || e.art === "grube") return;
          var sx = e.x - kamera;
          if (sx < -100 || sx > W + 60) return;
          if (e.art === "holz") holzZeichnen(sx, e.y + Math.sin(zeit * 4 + e.x) * 1.5, true);
          else if (e.art === "stein") steinZeichnen(e, sx);
          else if (e.art === "hecke") heckeZeichnen(e, sx);
          else if (e.art === "ast") astZeichnen(e, sx);
          else if (e.art === "wolf") { g.save(); g.translate(0, -(e.hoch || 0)); wolfZeichnen(e, sx); g.restore(); }
          else if (e.art === "fass") fassZeichnen(e, sx);
          else if (e.art === "rabe") rabeZeichnen(e, sx);
        });

        // Staub, Funken und verlorenes Holz
        staub.forEach(function (s) { g.fillStyle = "rgba(160,120,70," + Math.min(1, s.leben * 2).toFixed(2) + ")"; kreis(s.x, s.y, s.r); });
        funken.forEach(function (f) { g.fillStyle = "rgba(255,230,120," + Math.min(1, f.leben * 3).toFixed(2) + ")"; kreis(f.x, f.y, 1.8); });
        teile.forEach(function (t) { g.globalAlpha = Math.max(0, Math.min(1, t.leben)); holzZeichnen(t.x, t.y); g.globalAlpha = 1; });

        nebelZeichnen(t);
        reiterZeichnen();

        g.font = "bold 14px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
        texte.forEach(function (t) {
          g.globalAlpha = Math.min(1, t.leben * 2);
          g.lineWidth = 3; g.strokeStyle = "rgba(0,0,0,0.5)"; g.strokeText(t.text, t.x + 12, t.y);
          g.fillStyle = t.farbe; g.fillText(t.text, t.x + 12, t.y);
          g.globalAlpha = 1;
        });

        if (blitz > 0) {
          var rand = g.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 260);
          rand.addColorStop(0, "rgba(214,43,43,0)"); rand.addColorStop(1, "rgba(214,43,43," + (blitz * 2).toFixed(2) + ")");
          g.fillStyle = rand; g.fillRect(-5, -5, W + 10, H + 10);
        }

        anzeigeZeichnen();

        if (phase === "bereit") {
          g.fillStyle = "rgba(0,0,0,0.5)"; g.fillRect(-5, -5, W + 10, H + 10);
          g.fillStyle = "#fff"; g.textAlign = "center";
          g.font = "700 24px 'Barlow Condensed', sans-serif"; g.fillText("TIPPE ZUM LOSREITEN", W / 2, H / 2);
          g.textAlign = "left";
        }
        g.restore();
      }

      // Nur für automatische Tests (Adresse mit ?test)
      if (/[?&]test\b/.test(location.search)) {
        window.spielTest = {
          zustand: function () { return { phase: phase, kamera: kamera, reiter: reiter, holz: holz, welt: welt, tempo: tempoBei(kamera), grabenX: grabenX, treffer: treffer }; },
          druecken: druecken, loslassen: loslassen, neu: neu,
          schritt: function (dt, ohneBild) { aktualisieren(dt); if (!ohneBild) zeichnen(); },
          sichern: function () { return JSON.stringify({ welt: welt, kamera: kamera, reiter: reiter, holz: holz, unverwundbar: unverwundbar, gedrueckt: gedrueckt, sprungPuffer: sprungPuffer, phase: phase, treffer: treffer }); },
          laden: function (s) {
            var d = JSON.parse(s);
            welt = d.welt; kamera = d.kamera; reiter = d.reiter; holz = d.holz; unverwundbar = d.unverwundbar;
            gedrueckt = d.gedrueckt; sprungPuffer = d.sprungPuffer; phase = d.phase; treffer = d.treffer;
          }
        };
      }

      window.addEventListener("resize", function () { vermessen(); zeichnen(); });
      vermessen();
      neu();
      koerperBild.onload = zeichnen;
      burgBild.onload = zeichnen;
      if (document.fonts) document.fonts.ready.then(zeichnen);
    })();
  </script>
</body>
</html>
