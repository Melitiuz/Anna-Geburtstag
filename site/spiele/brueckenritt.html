<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Brückenritt</title>
  <link rel="stylesheet" href="../css/stil.css">
  <style>
    .buehne {
      width: 100%; max-width: 560px; margin: 0 auto;
      border-radius: var(--radius); overflow: hidden; border: 3px solid var(--akzent);
      touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
      background: #9fd8ff;
    }
    .buehne canvas { display: block; width: 100%; touch-action: none; }
    #meldung { min-height: 1.5em; font-weight: 600; text-align: center; margin-top: 12px; }
    .steuerung { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="seite">
    <a class="zurueck" href="../index.html">‹ Übersicht</a>
    <header class="kopf">
      <h1>🪵 Brückenritt</h1>
      <p class="unterzeile">Der Ritter reitet zur Burg, doch davor liegt ein Burggraben. Sammle unterwegs Holz für eine Brücke. Tippe auf das Spielfeld, um zu springen. Wer gegen Steine oder Dornenbüsche reitet, verliert Holz. Für die Brücke brauchst du mindestens <b id="t-noetig">20</b> von <b id="t-gesamt">30</b> Hölzern.</p>
    </header>
    <div class="buehne" id="buehne"><canvas id="leinwand"></canvas></div>
    <p id="meldung" aria-live="polite"></p>
    <div class="steuerung"><button class="knopf" type="button" id="aktion">Losreiten</button></div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/motive.js"></script>
  <script src="../js/fortschritt.js"></script>
  <script>
    (function () {
      // Virtuelles Spielfeld, wird auf die Bildschirmbreite skaliert
      var W = 400, H = 225, BODEN = 190, RX = 70;
      var HOLZ_GESAMT = 30, HOLZ_NOETIG = Math.ceil(HOLZ_GESAMT * 2 / 3), VERLUST = 3;
      var GRAVITATION = 1500, SPRUNG = -560;

      var buehne = document.getElementById("buehne");
      var leinwand = document.getElementById("leinwand");
      var g = leinwand.getContext("2d");
      var meldung = document.getElementById("meldung");
      var knopf = document.getElementById("aktion");
      document.getElementById("t-noetig").textContent = HOLZ_NOETIG;
      document.getElementById("t-gesamt").textContent = HOLZ_GESAMT;

      function bildAus(svg) {
        var img = new Image();
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        return img;
      }
      var ritterBild = bildAus(Motive.MOTIVE.ritter.zeichnen("rechts"));
      var burgBild = bildAus(Motive.MOTIVE.burg.zeichnen(2));

      var skala = 1, phase, welt, kamera, reiter, holz, unverwundbar, teile, grabenX, bauFortschritt, zeitImZiel, letzteZeit;

      function vermessen() {
        var dpr = window.devicePixelRatio || 1;
        var breite = buehne.clientWidth;
        skala = breite / W;
        leinwand.width = Math.round(breite * dpr);
        leinwand.height = Math.round(H * skala * dpr);
        leinwand.style.height = H * skala + "px";
        g.setTransform(dpr * skala, 0, 0, dpr * skala, 0, 0);
      }

      function mischen(a) {
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      }

      // Strecke: 30 Hölzer (am Boden oder in der Luft) und Hindernisse, bei jedem Versuch neu verteilt
      function streckeBauen() {
        var ereignisse = [];
        var hindernisse = 16, ueberHindernis = 6;
        for (var i = 0; i < hindernisse; i++) ereignisse.push({ hindernis: true, mitHolz: i < ueberHindernis });
        var frei = HOLZ_GESAMT - ueberHindernis;
        for (i = 0; i < frei; i++) ereignisse.push({ hindernis: false, luft: Math.random() < 0.55 });
        mischen(ereignisse);
        var x = 420, liste = [];
        ereignisse.forEach(function (e) {
          if (e.hindernis) {
            var stein = Math.random() < 0.5;
            liste.push({ art: stein ? "stein" : "busch", x: x, w: stein ? 30 : 36, h: stein ? 24 : 28 });
            if (e.mitHolz) liste.push({ art: "holz", x: x + 3, y: BODEN - 92 });
          } else {
            liste.push({ art: "holz", x: x, y: e.luft ? BODEN - 78 : BODEN - 16 });
          }
          x += 190 + Math.random() * 120;
        });
        grabenX = x + 260;
        return liste;
      }

      function neu() {
        welt = streckeBauen();
        kamera = 0;
        reiter = { y: BODEN, vy: 0, amBoden: true, x: RX };
        holz = 0;
        unverwundbar = 0;
        teile = [];
        bauFortschritt = 0;
        zeitImZiel = 0;
        phase = "bereit";
        meldung.textContent = "";
        knopf.textContent = "Losreiten";
        knopf.hidden = false;
        zeichnen();
      }

      function tempo() { return 150 + 70 * Math.min(1, kamera / grabenX); }

      function springen() {
        if (phase === "bereit") { phase = "laeuft"; knopf.hidden = true; letzteZeit = performance.now(); requestAnimationFrame(schleife); return; }
        if (phase === "laeuft" && reiter.amBoden) { reiter.vy = SPRUNG; reiter.amBoden = false; }
      }

      buehne.addEventListener("pointerdown", function (e) { e.preventDefault(); springen(); });
      document.addEventListener("keydown", function (e) {
        if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); springen(); }
      });
      knopf.addEventListener("click", function () {
        if (phase === "gescheitert") neu();
        springen();
      });

      function trefferbox() { return { l: reiter.x + 12, r: reiter.x + 42, o: reiter.y - 40, u: reiter.y }; }
      function ueberlappt(a, b) { return a.l < b.r && a.r > b.l && a.o < b.u && a.u > b.o; }

      function schleife(jetzt) {
        var dt = Math.min(0.04, (jetzt - letzteZeit) / 1000);
        letzteZeit = jetzt;
        aktualisieren(dt);
        zeichnen();
        if (phase !== "fertig" && phase !== "gescheitert" && phase !== "bereit") requestAnimationFrame(schleife);
      }

      function aktualisieren(dt) {
        // Sprungphysik
        if (!reiter.amBoden) {
          reiter.vy += GRAVITATION * dt;
          reiter.y += reiter.vy * dt;
          if (reiter.y >= BODEN) { reiter.y = BODEN; reiter.vy = 0; reiter.amBoden = true; }
        }
        if (unverwundbar > 0) unverwundbar -= dt;
        teile.forEach(function (t) { t.vy += GRAVITATION * 0.6 * dt; t.x += t.vx * dt; t.y += t.vy * dt; t.leben -= dt; });
        teile = teile.filter(function (t) { return t.leben > 0; });

        if (phase === "laeuft") {
          kamera += tempo() * dt;
          var box = trefferbox();
          welt.forEach(function (e) {
            if (e.weg) return;
            var sx = e.x - kamera;
            if (e.art === "holz") {
              if (ueberlappt(box, { l: sx, r: sx + 26, o: e.y - 8, u: e.y + 8 })) { e.weg = true; holz++; }
            } else if (unverwundbar <= 0 && ueberlappt(box, { l: sx + 4, r: sx + e.w - 4, o: BODEN - e.h + 4, u: BODEN })) {
              var verlust = Math.min(VERLUST, holz);
              holz -= verlust;
              unverwundbar = 1.2;
              for (var i = 0; i < verlust; i++) teile.push({ x: reiter.x + 26, y: reiter.y - 30, vx: -80 - Math.random() * 120, vy: -250 - Math.random() * 150, leben: 1.2 });
              meldung.textContent = verlust ? "Autsch! " + verlust + (verlust === 1 ? " Holz verloren." : " Hölzer verloren.") : "Autsch! Zum Glück hattest du noch kein Holz.";
            }
          });
          // Am Graben anhalten: der Graben steht dann bei Bildschirm-x 190
          if (kamera >= grabenX - 190) {
            kamera = grabenX - 190;
            if (reiter.amBoden) { phase = "ankunft"; meldung.textContent = "Der Burggraben! Jetzt wird gebaut."; }
          }
        } else if (phase === "ankunft") {
          reiter.x = Math.min(reiter.x + 90 * dt, 136);
          if (reiter.x >= 136) phase = "bauen";
        } else if (phase === "bauen") {
          var ziel = Math.min(holz, HOLZ_NOETIG);
          bauFortschritt = Math.min(ziel, bauFortschritt + dt * 12);
          if (bauFortschritt >= ziel) {
            if (holz >= HOLZ_NOETIG) { phase = "ueberqueren"; meldung.textContent = "Die Brücke steht!"; }
            else {
              phase = "gescheitert";
              meldung.textContent = "Nur " + holz + " von " + HOLZ_NOETIG + " Hölzern. Die Brücke ist zu kurz!";
              knopf.textContent = "Noch einmal";
              knopf.hidden = false;
            }
          }
        } else if (phase === "ueberqueren") {
          reiter.x += 90 * dt;
          if (reiter.x >= 270) {
            phase = "fertig";
            meldung.textContent = "Der Ritter hat die Burg erreicht!";
            setTimeout(function () { Fortschritt.gewinnen("brueckenritt"); }, 500);
          }
        }
      }

      // ---------- Zeichnen ----------
      function holzZeichnen(x, y) {
        g.fillStyle = "#8a5a2b";
        g.fillRect(x, y - 6, 24, 12);
        g.fillStyle = "#6e4420";
        g.fillRect(x + 4, y - 3, 14, 2);
        g.fillStyle = "#d9a86c";
        g.beginPath(); g.ellipse(x + 24, y, 4, 6, 0, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "#8a5a2b"; g.lineWidth = 1;
        g.beginPath(); g.ellipse(x + 24, y, 2, 3, 0, 0, Math.PI * 2); g.stroke();
      }

      function hindernisZeichnen(e, sx) {
        if (e.art === "stein") {
          g.fillStyle = "#8d8f99";
          g.beginPath();
          g.moveTo(sx, BODEN); g.lineTo(sx + 5, BODEN - e.h + 6); g.lineTo(sx + 14, BODEN - e.h); g.lineTo(sx + 26, BODEN - e.h + 8); g.lineTo(sx + e.w, BODEN);
          g.closePath(); g.fill();
          g.fillStyle = "#b3b6c2";
          g.beginPath(); g.moveTo(sx + 8, BODEN - e.h + 8); g.lineTo(sx + 14, BODEN - e.h + 3); g.lineTo(sx + 18, BODEN - e.h + 10); g.closePath(); g.fill();
        } else {
          g.fillStyle = "#2f6b33";
          [[10, 14, 11], [22, 10, 12], [28, 18, 9], [16, 20, 10]].forEach(function (k) {
            g.beginPath(); g.arc(sx + k[0], BODEN - k[1], k[2], 0, Math.PI * 2); g.fill();
          });
          g.strokeStyle = "#d9c27a"; g.lineWidth = 1.2;
          for (var i = 0; i < 7; i++) {
            var a = sx + 4 + i * 5, b = BODEN - 10 - (i % 3) * 7;
            g.beginPath(); g.moveTo(a, b); g.lineTo(a - 3, b - 4); g.stroke();
          }
        }
      }

      function zeichnen() {
        // Himmel und Hügel
        var himmel = g.createLinearGradient(0, 0, 0, BODEN);
        himmel.addColorStop(0, "#7cc8ff"); himmel.addColorStop(1, "#d6f0ff");
        g.fillStyle = himmel; g.fillRect(0, 0, W, H);
        g.fillStyle = "#ffe27a"; g.beginPath(); g.arc(350, 36, 18, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#a9dc8f";
        g.beginPath(); g.moveTo(0, BODEN);
        for (var x = 0; x <= W; x += 10) g.lineTo(x, BODEN - 40 - 18 * Math.sin((x + kamera * 0.3) / 60));
        g.lineTo(W, BODEN); g.closePath(); g.fill();

        // Boden
        g.fillStyle = "#8b6b3e"; g.fillRect(0, BODEN, W, H - BODEN);
        g.fillStyle = "#5cb85c"; g.fillRect(0, BODEN, W, 7);
        g.fillStyle = "#7a5c33";
        for (var i = 0; i < 12; i++) { var bx = i * 40 - (kamera % 40); g.fillRect(bx, BODEN + 14, 18, 3); g.fillRect(bx + 20, BODEN + 24, 12, 3); }

        // Burggraben, Brücke und Burg am Ende der Strecke
        var gx = grabenX - kamera;
        if (gx < W + 200) {
          g.fillStyle = "#3b7fc4"; g.fillRect(gx, BODEN, 80, H - BODEN);
          g.fillStyle = "#5aa2e6"; g.fillRect(gx, BODEN + 4, 80, 3);
          g.fillStyle = "#8b6b3e"; g.fillRect(gx + 80, BODEN, W, H - BODEN);
          g.fillStyle = "#5cb85c"; g.fillRect(gx + 80, BODEN, W, 7);
          if (burgBild.complete) g.drawImage(burgBild, gx + 70, BODEN - 120, 130, 130);
          // Brückenbretter: jedes Holz ist ein Brett
          var bretter = Math.floor(bauFortschritt);
          var breite = 80 / HOLZ_NOETIG;
          for (var b = 0; b < bretter; b++) {
            g.fillStyle = b % 2 ? "#8a5a2b" : "#9c6a35";
            g.fillRect(gx + b * breite, BODEN - 2, breite - 0.5, 8);
          }
        }

        // Holz und Hindernisse
        welt.forEach(function (e) {
          if (e.weg) return;
          var sx = e.x - kamera;
          if (sx < -50 || sx > W + 50) return;
          if (e.art === "holz") holzZeichnen(sx, e.y);
          else hindernisZeichnen(e, sx);
        });

        // Verlorenes Holz fliegt davon
        teile.forEach(function (t) { g.globalAlpha = Math.max(0, t.leben); holzZeichnen(t.x, t.y); g.globalAlpha = 1; });

        // Reiter (blinkt nach einem Treffer)
        if (!(unverwundbar > 0 && Math.floor(unverwundbar * 10) % 2 === 0) && ritterBild.complete) {
          var huepf = reiter.amBoden && (phase === "laeuft" || phase === "ankunft" || phase === "ueberqueren") ? Math.abs(Math.sin(kamera / 14 + reiter.x / 14)) * 2 : 0;
          g.drawImage(ritterBild, reiter.x - 4, reiter.y - 58 - huepf, 62, 62);
        }

        // Anzeige oben: Holz und Strecke
        g.fillStyle = "rgba(0,0,0,0.55)";
        g.fillRect(8, 8, 118, 26);
        holzZeichnen(14, 21);
        g.fillStyle = holz >= HOLZ_NOETIG ? "#7dff9d" : "#fff";
        g.font = "bold 14px sans-serif";
        g.textBaseline = "middle";
        g.fillText(holz + " / " + HOLZ_NOETIG, 46, 22);
        var anteil = Math.min(1, kamera / (grabenX - 190));
        g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(140, 18, 250, 6);
        g.fillStyle = "#d62b2b"; g.fillRect(140, 18, 250 * anteil, 6);

        if (phase === "bereit") {
          g.fillStyle = "rgba(0,0,0,0.45)"; g.fillRect(0, 0, W, H);
          g.fillStyle = "#fff"; g.font = "bold 18px sans-serif"; g.textAlign = "center";
          g.fillText("Tippe zum Losreiten", W / 2, H / 2 - 8);
          g.font = "13px sans-serif";
          g.fillText("Tippen = springen", W / 2, H / 2 + 16);
          g.textAlign = "left";
        }
      }

      // Nur für automatische Tests (Adresse mit ?test): Spielzustand auslesen
      if (/[?&]test\b/.test(location.search)) {
        window.spielTest = {
          zustand: function () { return { phase: phase, kamera: kamera, reiter: reiter, holz: holz, welt: welt, tempo: tempo() }; },
          springen: springen,
          schritt: function (dt) { aktualisieren(dt); zeichnen(); }
        };
      }

      window.addEventListener("resize", function () { vermessen(); zeichnen(); });
      vermessen();
      neu();
      ritterBild.onload = zeichnen;
      burgBild.onload = zeichnen;
    })();
  </script>
</body>
</html>
