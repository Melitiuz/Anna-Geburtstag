<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Kerzen auspusten</title>
  <link rel="stylesheet" href="../css/stil.css">
  <style>
    .torte {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      width: min(100%, 360px); margin: 0 auto; padding: 16px;
      background: linear-gradient(#ffd6e3, #f7a8c1); border-radius: 24px 24px 40px 40px;
      box-shadow: 0 10px 0 #d9789a, var(--schatten);
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
    }
    .kerze {
      position: relative; aspect-ratio: 3 / 4; border: none; background: none; padding: 0; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    }
    .kerze .wachs {
      width: 34%; height: 58%; border-radius: 6px 6px 3px 3px;
      background: repeating-linear-gradient(135deg, #fff 0 8px, #7c5cff 8px 14px);
      box-shadow: inset -3px 0 0 rgba(0,0,0,0.08);
    }
    .kerze .docht { width: 3px; height: 8%; background: #4a3a3a; }
    .kerze .flamme {
      position: absolute; top: 6%; left: 50%; width: 30%; height: 30%;
      margin-left: -15%;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 50% 70%, #fff6b0, #ffb02e 55%, #ff6a1f);
      box-shadow: 0 0 18px 6px rgba(255, 176, 46, 0.6);
      transform: scale(0); transition: transform 0.12s;
      animation: flackern 0.3s infinite alternate;
    }
    .kerze.an .flamme { transform: scale(1); }
    .kerze .rauch { position: absolute; top: 4%; left: 50%; font-size: 1.4rem; opacity: 0; transform: translateX(-50%); }
    .kerze.aus .rauch { animation: rauch 0.6s ease-out; }
    @keyframes flackern { from { filter: brightness(1); } to { filter: brightness(1.25); } }
    @keyframes rauch { from { opacity: 0.9; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -30px); } }
    .werte { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 16px; font-size: 1.1rem; }
    .zeitbalken { height: 8px; background: var(--rand); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
    .zeitbalken div { height: 100%; background: var(--akzent); width: 100%; }
  </style>
</head>
<body>
  <main class="seite">
    <a class="zurueck" href="../index.html">‹ Übersicht</a>
    <header class="kopf">
      <h1>🕯️ Kerzen auspusten</h1>
      <p class="unterzeile">Immer wieder geht eine Kerze an. Tippe schnell darauf, um sie auszupusten. Schaffst du <b id="ziel"></b> Kerzen in <b id="dauer"></b> Sekunden?</p>
    </header>
    <div class="werte"><span>🕯️ <span id="punkte">0</span> / <span id="ziel2"></span></span><span>⏱️ <span id="zeit"></span> s</span></div>
    <div class="zeitbalken"><div id="zeitbalken"></div></div>
    <div class="torte" id="torte"></div>
    <p class="mitte" style="margin-top:28px"><button class="knopf" id="start" type="button">Los geht's</button></p>
    <p class="mitte" id="meldung"></p>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/motive.js"></script>
  <script src="../js/fortschritt.js"></script>
  <script>
    (function () {
      var ZIEL = 20, DAUER = 30;
      var torte = document.getElementById("torte");
      var punkteEl = document.getElementById("punkte");
      var zeitEl = document.getElementById("zeit");
      var balken = document.getElementById("zeitbalken");
      var knopf = document.getElementById("start");
      var meldung = document.getElementById("meldung");
      var kerzen = [], punkte = 0, laeuft = false, startZeit = 0, timer = null, uhr = null;

      document.getElementById("ziel").textContent = ZIEL;
      document.getElementById("ziel2").textContent = ZIEL;
      document.getElementById("dauer").textContent = DAUER;
      zeitEl.textContent = DAUER;

      for (var i = 0; i < 9; i++) {
        var k = document.createElement("button");
        k.type = "button";
        k.className = "kerze";
        k.setAttribute("aria-label", "Kerze");
        k.innerHTML = '<div class="flamme"></div><div class="rauch">💨</div><div class="docht"></div><div class="wachs"></div>';
        torte.appendChild(k);
        kerzen.push(k);
      }

      // pointerdown reagiert auf dem Handy schneller als click
      torte.addEventListener("pointerdown", function (e) {
        var k = e.target.closest(".kerze");
        if (!k || !laeuft || !k.classList.contains("an")) return;
        e.preventDefault();
        auspusten(k);
        punkte++;
        punkteEl.textContent = punkte;
        if (punkte >= ZIEL) ende(true);
      });

      function auspusten(k) {
        clearTimeout(k._aus);
        k.classList.remove("an", "aus");
        void k.offsetWidth;
        k.classList.add("aus");
      }

      function anzuenden() {
        if (!laeuft) return;
        var frei = kerzen.filter(function (k) { return !k.classList.contains("an"); });
        if (frei.length) {
          var k = frei[Math.floor(Math.random() * frei.length)];
          var vergangen = (performance.now() - startZeit) / 1000;
          var brenndauer = Math.max(650, 1300 - vergangen * 22);
          k.classList.remove("aus");
          k.classList.add("an");
          k._aus = setTimeout(function () { k.classList.remove("an"); }, brenndauer);
        }
        timer = setTimeout(anzuenden, 380 + Math.random() * 380);
      }

      function start() {
        punkte = 0; punkteEl.textContent = 0;
        meldung.textContent = "";
        kerzen.forEach(function (k) { clearTimeout(k._aus); k.classList.remove("an", "aus"); });
        laeuft = true;
        knopf.hidden = true;
        startZeit = performance.now();
        anzuenden();
        uhr = setInterval(function () {
          var rest = Math.max(0, DAUER - (performance.now() - startZeit) / 1000);
          zeitEl.textContent = Math.ceil(rest);
          balken.style.width = (rest / DAUER) * 100 + "%";
          if (rest <= 0) ende(false);
        }, 100);
      }

      function ende(gewonnen) {
        laeuft = false;
        clearTimeout(timer);
        clearInterval(uhr);
        kerzen.forEach(function (k) { clearTimeout(k._aus); k.classList.remove("an"); });
        if (gewonnen) {
          Fortschritt.gewinnen("kerzen");
        } else {
          meldung.textContent = "Nur " + punkte + " Kerzen. Tief Luft holen und noch einmal!";
          knopf.textContent = "Noch einmal";
          knopf.hidden = false;
          zeitEl.textContent = DAUER;
          balken.style.width = "100%";
        }
      }

      knopf.addEventListener("click", start);
    })();
  </script>
</body>
</html>
