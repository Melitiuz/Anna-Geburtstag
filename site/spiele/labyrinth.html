<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ritter-Labyrinth</title>
  <link rel="stylesheet" href="../css/stil.css">
  <style>
    .feld {
      width: 100%; max-width: 440px; margin: 0 auto;
      border-radius: var(--radius); overflow: hidden; border: 3px solid var(--akzent);
      touch-action: none; user-select: none; -webkit-user-select: none;
      background: #e3d3a8;
    }
    .feld canvas { display: block; width: 100%; touch-action: none; }
    .feld.autsch { animation: autsch 0.35s; }
    @keyframes autsch { 0%, 100% { box-shadow: var(--schatten); } 40% { box-shadow: 0 0 0 6px var(--akzent); } }
    .werte { display: flex; justify-content: space-between; font-family: var(--schrift-schmal); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 1.1rem; color: var(--text-leise); margin-bottom: 12px; }
    #meldung { min-height: 1.5em; font-weight: 600; }
  </style>
</head>
<body>
  <main class="seite">
    <a class="zurueck" href="../index.html">‹ Übersicht</a>
    <header class="kopf">
      <h1>🏰 Ritter-Labyrinth</h1>
      <p class="unterzeile">Der Ritter steht vor dem Heckenlabyrinth. Drei Eingänge führen hinein, aber nur einer bringt ihn zur Burg in der Mitte. Wische irgendwo auf dem Spielfeld, der Ritter bewegt sich mit. Berührt er eine Hecke, muss er zurück zum Start.</p>
    </header>
    <div class="werte"><span>Versuch: <b id="versuch">1</b></span><span>Ziel: Burg in der Mitte</span></div>
    <div class="feld" id="feld"><canvas id="leinwand"></canvas></div>
    <p class="mitte" id="meldung" aria-live="polite"></p>
    <p class="mitte"><button class="knopf zweit" id="neu" type="button">Neues Labyrinth</button></p>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/motive.js"></script>
  <script src="../js/fortschritt.js"></script>
  <script>
    (function () {
      var N = 9;               // Labyrinth hat N x N Felder
      var HOF = [3, 5];        // Burghof: Felder 3 bis 5 in beiden Richtungen
      var RAND = 1;            // freier Weg außen herum, in Feldern
      var feld = document.getElementById("feld");
      var leinwand = document.getElementById("leinwand");
      var g = leinwand.getContext("2d");
      var versuchEl = document.getElementById("versuch");
      var meldung = document.getElementById("meldung");

      function bildAus(svg) {
        var img = new Image();
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        img.onload = zeichnen;
        return img;
      }
      var ritterBild = bildAus(Motive.MOTIVE.ritter.svg);
      var burgBild = bildAus(Motive.MOTIVE.burg.svg);

      function imHof(x, y) { return x >= HOF[0] && x <= HOF[1] && y >= HOF[0] && y <= HOF[1]; }
      function id(x, y) { return y * N + x; }
      function kante(a, b) { return a < b ? a + "-" + b : b + "-" + a; }
      function mischen(a) {
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      }
      function nachbarn(z) {
        var x = z % N, y = Math.floor(z / N), n = [];
        if (x > 0) n.push(z - 1);
        if (x < N - 1) n.push(z + 1);
        if (y > 0) n.push(z - N);
        if (y < N - 1) n.push(z + N);
        return n.filter(function (w) { return !imHof(w % N, Math.floor(w / N)); });
      }

      // Feld am Außenrand einer Seite, ohne Ecken
      function randFeld(seite, i) {
        if (seite === "oben") return id(i, 0);
        if (seite === "unten") return id(i, N - 1);
        if (seite === "links") return id(0, i);
        return id(N - 1, i);
      }

      // Drei getrennte Bereiche wachsen gleichzeitig: Bereich 0 hängt am Burghof,
      // die Bereiche 1 und 2 beginnen an den falschen Eingängen und enden als Sackgassen.
      function erzeugen() {
        for (var versuche = 0; versuche < 200; versuche++) {
          var seiten = mischen(["oben", "unten", "links", "rechts"]).slice(0, 3);
          var hofTore = [[4, 2, 4, 3], [4, 6, 4, 5], [2, 4, 3, 4], [6, 4, 5, 4]];
          var tor = hofTore[Math.floor(Math.random() * 4)];
          var vorHof = id(tor[0], tor[1]), hofFeld = id(tor[2], tor[3]);

          var bereich = new Array(N * N).fill(-1), offen = {};
          var aktiv = [[vorHof], [], []];
          var falscheTore = [];
          bereich[vorHof] = 0;
          for (var b = 1; b <= 2; b++) {
            var start = randFeld(seiten[b], 1 + Math.floor(Math.random() * (N - 2)));
            if (bereich[start] >= 0) break;
            bereich[start] = b;
            aktiv[b].push(start);
            falscheTore.push({ seite: seiten[b], feld: start });
          }
          if (falscheTore.length < 2) continue;

          var laeuft = true;
          while (laeuft) {
            laeuft = false;
            for (b = 0; b < 3; b++) {
              while (aktiv[b].length) {
                var k = Math.random() < 0.7 ? aktiv[b].length - 1 : Math.floor(Math.random() * aktiv[b].length);
                var z = aktiv[b][k];
                var frei = nachbarn(z).filter(function (w) { return bereich[w] < 0; });
                if (!frei.length) { aktiv[b].splice(k, 1); continue; }
                var w = frei[Math.floor(Math.random() * frei.length)];
                bereich[w] = b;
                offen[kante(z, w)] = true;
                aktiv[b].push(w);
                laeuft = true;
                break;
              }
            }
          }

          // Richtiger Eingang: ein Randfeld von Bereich 0 auf der dritten Seite
          var kandidaten = [];
          for (var i = 1; i < N - 1; i++) {
            var r = randFeld(seiten[0], i);
            if (bereich[r] === 0) kandidaten.push(r);
          }
          var groesse = [0, 0, 0];
          bereich.forEach(function (v) { if (v >= 0) groesse[v]++; });
          if (!kandidaten.length || groesse[1] < 10 || groesse[2] < 10) continue;

          offen[kante(vorHof, hofFeld)] = true;
          return {
            offen: offen,
            tore: [{ seite: seiten[0], feld: kandidaten[Math.floor(Math.random() * kandidaten.length)], richtig: true }]
              .concat(falscheTore.map(function (t) { return { seite: t.seite, feld: t.feld, richtig: false }; }))
          };
        }
        return null;
      }

      var plan, zelle, breite, waende, ritter, radius, versuch = 1, fertig = false, sperre = false;

      function vermessen() {
        var dpr = window.devicePixelRatio || 1;
        breite = feld.clientWidth;
        zelle = breite / (N + 2 * RAND);
        leinwand.width = Math.round(breite * dpr);
        leinwand.height = Math.round(breite * dpr);
        leinwand.style.height = breite + "px";
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        radius = zelle * 0.22;

        var O = RAND * zelle;
        function px(v) { return O + v * zelle; }
        waende = [];
        // Spielfeldrand, damit der Ritter nicht hinausläuft
        waende.push([0, 0, breite, 0], [0, breite, breite, breite], [0, 0, 0, breite], [breite, 0, breite, breite]);

        // Außenmauer mit drei Lücken
        var lueckeAn = {};
        plan.tore.forEach(function (t) { lueckeAn[t.seite + t.feld] = true; });
        for (var i = 0; i < N; i++) {
          if (!lueckeAn["oben" + randFeld("oben", i)]) waende.push([px(i), px(0), px(i + 1), px(0)]);
          if (!lueckeAn["unten" + randFeld("unten", i)]) waende.push([px(i), px(N), px(i + 1), px(N)]);
          if (!lueckeAn["links" + randFeld("links", i)]) waende.push([px(0), px(i), px(0), px(i + 1)]);
          if (!lueckeAn["rechts" + randFeld("rechts", i)]) waende.push([px(N), px(i), px(N), px(i + 1)]);
        }

        // Hecken zwischen den Feldern
        for (var y = 0; y < N; y++) {
          for (var x = 0; x < N; x++) {
            var z = id(x, y);
            if (x < N - 1) {
              var r = id(x + 1, y);
              if (!(imHof(x, y) && imHof(x + 1, y)) && !plan.offen[kante(z, r)]) waende.push([px(x + 1), px(y), px(x + 1), px(y + 1)]);
            }
            if (y < N - 1) {
              var u = id(x, y + 1);
              if (!(imHof(x, y) && imHof(x, y + 1)) && !plan.offen[kante(z, u)]) waende.push([px(x), px(y + 1), px(x + 1), px(y + 1)]);
            }
          }
        }
      }

      function start() { return { x: breite / 2, y: breite - RAND * zelle / 2 }; }

      function neu() {
        plan = erzeugen();
        vermessen();
        ritter = start();
        fertig = false;
        meldung.textContent = "";
        zeichnen();
      }

      function zeichnen() {
        if (!plan) return;
        var O = RAND * zelle;
        g.clearRect(0, 0, breite, breite);
        // außen: Sandweg, innen: Wiese, Mitte: Burghof
        g.fillStyle = "#e3d3a8";
        g.fillRect(0, 0, breite, breite);
        g.fillStyle = "#cfeebc";
        g.fillRect(O, O, N * zelle, N * zelle);
        g.fillStyle = "#d9d3c4";
        g.fillRect(O + HOF[0] * zelle, O + HOF[0] * zelle, 3 * zelle, 3 * zelle);

        g.lineCap = "round";
        g.strokeStyle = "#2f7d3a";
        g.lineWidth = Math.max(4, zelle * 0.16);
        g.beginPath();
        waende.slice(4).forEach(function (w) { g.moveTo(w[0], w[1]); g.lineTo(w[2], w[3]); });
        g.stroke();
        g.strokeStyle = "#45a352";
        g.lineWidth = Math.max(2, zelle * 0.06);
        g.stroke();

        var bs = zelle * 2.5;
        if (burgBild.complete) g.drawImage(burgBild, breite / 2 - bs / 2, breite / 2 - bs / 2, bs, bs);
        var rs = radius * 3.4;
        if (ritterBild.complete) g.drawImage(ritterBild, ritter.x - rs / 2, ritter.y - rs / 2 - radius * 0.3, rs, rs);
      }

      function abstand(px, py, w) {
        var dx = w[2] - w[0], dy = w[3] - w[1];
        var t = Math.max(0, Math.min(1, ((px - w[0]) * dx + (py - w[1]) * dy) / (dx * dx + dy * dy)));
        return Math.hypot(px - (w[0] + t * dx), py - (w[1] + t * dy));
      }

      function trifftHecke(x, y) {
        var dicke = Math.max(4, zelle * 0.16) / 2;
        for (var i = 0; i < waende.length; i++) if (abstand(x, y, waende[i]) < radius + dicke) return true;
        return false;
      }

      function bewegen(dx, dy) {
        if (fertig || sperre) return;
        var schritte = Math.ceil(Math.hypot(dx, dy) / 2) || 1;
        for (var i = 0; i < schritte; i++) {
          var nx = ritter.x + dx / schritte, ny = ritter.y + dy / schritte;
          if (trifftHecke(nx, ny)) return autsch();
          ritter.x = nx; ritter.y = ny;
        }
        if (Math.hypot(ritter.x - breite / 2, ritter.y - breite / 2) < zelle * 0.8) {
          fertig = true;
          zeichnen();
          meldung.textContent = "Der Ritter ist an der Burg angekommen!";
          setTimeout(function () { Fortschritt.gewinnen("labyrinth"); }, 400);
          return;
        }
        zeichnen();
      }

      function autsch() {
        sperre = true;
        zug = null;
        feld.classList.remove("autsch");
        void feld.offsetWidth;
        feld.classList.add("autsch");
        if (navigator.vibrate) navigator.vibrate(120);
        meldung.textContent = "Autsch, die Hecke! Zurück zum Start.";
        setTimeout(function () {
          ritter = start();
          versuch++;
          versuchEl.textContent = versuch;
          sperre = false;
          zeichnen();
        }, 450);
      }

      // Wischen: der Ritter folgt der Fingerbewegung, egal wo auf dem Feld gewischt wird
      var zug = null;
      leinwand.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        try { leinwand.setPointerCapture(e.pointerId); } catch (fehler) {}
        zug = { id: e.pointerId, x: e.clientX, y: e.clientY };
        if (!sperre && !fertig) meldung.textContent = "";
      });
      leinwand.addEventListener("pointermove", function (e) {
        if (!zug || e.pointerId !== zug.id) return;
        var dx = e.clientX - zug.x, dy = e.clientY - zug.y;
        zug.x = e.clientX; zug.y = e.clientY;
        bewegen(dx, dy);
      });
      function ende(e) { if (zug && e.pointerId === zug.id) zug = null; }
      leinwand.addEventListener("pointerup", ende);
      leinwand.addEventListener("pointercancel", ende);

      window.addEventListener("resize", function () {
        var alteZelle = zelle;
        vermessen();
        ritter.x *= zelle / alteZelle;
        ritter.y *= zelle / alteZelle;
        zeichnen();
      });

      document.getElementById("neu").addEventListener("click", function () {
        versuch = 1;
        versuchEl.textContent = 1;
        neu();
      });
      neu();
    })();
  </script>
</body>
</html>
