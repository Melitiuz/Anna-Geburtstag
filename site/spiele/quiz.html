<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quiz</title>
  <link rel="stylesheet" href="../css/stil.css">
  <style>
    .antworten { display: grid; gap: 10px; margin-top: 16px; }
    .antwort {
      min-height: 52px; padding: 12px 16px; text-align: left;
      border: 2px solid var(--rand); border-radius: 10px; background: var(--karte-2);
      font: inherit; font-size: 1rem; font-weight: 600; color: var(--text); cursor: pointer;
      touch-action: manipulation;
    }
    .antwort.richtig { background: rgba(53, 196, 111, 0.22); border-color: var(--gruen); }
    .antwort.falsch { background: rgba(214, 43, 43, 0.25); border-color: var(--akzent); }
    .balken { height: 8px; background: var(--rand); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
    .balken div { height: 100%; background: var(--akzent-2); width: 0; transition: width 0.3s; }
    .nummer { color: var(--akzent); font-family: var(--schrift-schmal); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <main class="seite">
    <a class="zurueck" href="../index.html">‹ Übersicht</a>
    <header class="kopf">
      <h1>❓ Quiz</h1>
      <p class="unterzeile" id="regel"></p>
    </header>
    <div class="balken"><div id="balken"></div></div>
    <section class="karte" id="karte"></section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/motive.js"></script>
  <script src="../js/fortschritt.js"></script>
  <script>
    (function () {
      var Q = window.GEBURTSTAG.quiz;
      var karte = document.getElementById("karte");
      var balken = document.getElementById("balken");
      var nr, punkte;

      document.getElementById("regel").textContent =
        "Beantworte " + Q.fragen.length + " Fragen. Mindestens " + Q.mindestensRichtig + " müssen richtig sein.";

      function start() { nr = 0; punkte = 0; frage(); }

      function frage() {
        balken.style.width = (nr / Q.fragen.length) * 100 + "%";
        if (nr >= Q.fragen.length) return ende();
        var f = Q.fragen[nr];
        karte.innerHTML = '<div class="nummer">Frage ' + (nr + 1) + " von " + Q.fragen.length + "</div><h2></h2>" +
          '<div class="antworten"></div>';
        karte.querySelector("h2").textContent = f.frage;
        var box = karte.querySelector(".antworten");
        f.antworten.forEach(function (text, i) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "antwort";
          b.textContent = text;
          b.addEventListener("click", function () { waehlen(i, b, box, f); });
          box.appendChild(b);
        });
      }

      function waehlen(i, b, box, f) {
        if (box.dataset.fertig) return;
        box.dataset.fertig = "1";
        if (i === f.richtig) {
          punkte++;
          b.classList.add("richtig");
        } else {
          b.classList.add("falsch");
          box.children[f.richtig].classList.add("richtig");
        }
        setTimeout(function () { nr++; frage(); }, 1100);
      }

      function ende() {
        var geschafft = punkte >= Q.mindestensRichtig;
        karte.innerHTML = '<div class="mitte"><h2>' + punkte + " von " + Q.fragen.length + " richtig</h2><p>" +
          (geschafft ? "Super gemacht!" : "Knapp daneben. Versuch es gleich noch einmal!") + "</p>" +
          (geschafft ? "" : '<button class="knopf" type="button" id="nochmal">Noch einmal</button>') + "</div>";
        if (geschafft) Fortschritt.gewinnen("quiz");
        else document.getElementById("nochmal").addEventListener("click", start);
      }

      start();
    })();
  </script>
</body>
</html>
