<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Royals-Quiz</title>
  <link rel="stylesheet" href="../css/stil.css">
  <style>
    .antworten { display: grid; gap: 10px; margin-top: 16px; }
    .antwort {
      min-height: 52px; padding: 12px 16px; text-align: left;
      border: 2px solid var(--rand); border-radius: 10px; background: var(--karte-2);
      font: inherit; font-size: 1rem; font-weight: 600; color: var(--text); cursor: pointer;
      touch-action: manipulation;
    }
    .antwort.gewaehlt { background: rgba(255, 255, 255, 0.18); border-color: #fff; }
    .balken { height: 8px; background: var(--rand); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
    .balken div { height: 100%; background: var(--akzent-2); width: 100%; }
    .quizbild { display: block; width: 100%; max-height: 260px; object-fit: cover; object-position: center 25%; border-radius: 10px; margin: 6px 0 4px; background: #222; }
    .bildquelle { font-size: 0.7rem; color: #8a8a8a; text-align: right; }
    .nummer { color: var(--akzent); font-family: var(--schrift-schmal); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <main class="seite">
    <a class="zurueck" href="../index.html">‹ Übersicht</a>
    <header class="kopf">
      <h1><span class="titel-icon" data-icon="quiz"></span> Royals-Quiz</h1>
      <p class="unterzeile" id="regel"></p>
    </header>
    <div class="balken" aria-hidden="true"><div id="balken"></div></div>
    <section class="karte" id="karte"></section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/motive.js"></script>
  <script src="../js/fortschritt.js"></script>
  <script>
    (function () {
      var Q = window.GEBURTSTAG.quiz;
      var LETZTE = "gb-quiz-letzte-runde";
      var karte = document.getElementById("karte");
      var balken = document.getElementById("balken");
      var QUOTE = Q.quote || { gb: 4, eu: 4, jp: 2 };
      var ZEIT = 5 * 60 * 1000; // 5 Minuten für alle Fragen einer Runde, sichtbar nur als ablaufender Balken
      var verfuegbar, ANZAHL, MINDESTENS, runde, nr, punkte, startZeit, uhr, vorbei;

      function uhrStarten() {
        clearInterval(uhr);
        startZeit = Date.now();
        vorbei = false;
        uhr = setInterval(uhrTick, 200);
        uhrTick();
      }
      function uhrTick() {
        var rest = Math.max(0, 1 - (Date.now() - startZeit) / ZEIT);
        balken.style.width = rest * 100 + "%";
        if (rest <= 0) zeitAbgelaufen();
      }
      function zeitAbgelaufen() {
        clearInterval(uhr);
        vorbei = true;
        if (nr === 0) Fortschritt.versuch("quiz"); // auch eine Runde ohne Antwort zählt als Versuch
        karte.innerHTML = '<div class="mitte"><div style="font-size:3rem" aria-hidden="true">⏳</div><h2>Die Zeit ist um!</h2>' +
          '<p>Leider hat die Zeit nicht für alle Fragen gereicht. Nächstes Mal mehr Glück!</p>' +
          '<button class="knopf" type="button" id="nochmal">Noch einmal</button></div>';
        document.getElementById("nochmal").addEventListener("click", start);
      }

      function bildPfad(f) { return Fortschritt.wurzel + f.bild; }

      // Bildfragen nur verwenden, wenn das Bild auch wirklich geladen werden kann
      function bilderPruefen() {
        return Promise.all(Q.fragen.map(function (f, i) {
          if (!f.bild) return Promise.resolve(i);
          return new Promise(function (fertig) {
            var img = new Image();
            img.onload = function () { fertig(i); };
            img.onerror = function () { fertig(-1); };
            img.src = bildPfad(f);
          });
        })).then(function (liste) { return liste.filter(function (i) { return i >= 0; }); });
      }

      function mischen(a) {
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      }

      function letzteLaden() {
        try { return JSON.parse(localStorage.getItem(LETZTE)) || []; } catch (e) { return []; }
      }

      // Zieht anzahl Fragen aus liste, bevorzugt solche, die in der vorigen Runde nicht dran waren
      function ziehen(liste, anzahl, letzte) {
        var neu = mischen(liste.filter(function (i) { return letzte.indexOf(i) < 0; }));
        if (neu.length < anzahl) neu = neu.concat(mischen(liste.filter(function (i) { return neu.indexOf(i) < 0; })));
        return neu.slice(0, anzahl);
      }

      // Neue Runde: je Bereich genau so viele Fragen wie in der Quote, danach alles gemischt
      function start() {
        var letzte = letzteLaden();
        runde = [];
        Object.keys(QUOTE).forEach(function (b) {
          var imBereich = verfuegbar.filter(function (i) { return Q.fragen[i].bereich === b; });
          runde = runde.concat(ziehen(imBereich, QUOTE[b], letzte));
        });
        // Falls ein Bereich zu wenige Fragen hat, mit beliebigen anderen auffüllen
        if (runde.length < ANZAHL) runde = runde.concat(ziehen(verfuegbar.filter(function (i) { return runde.indexOf(i) < 0; }), ANZAHL - runde.length, letzte));
        runde = mischen(runde);
        try { localStorage.setItem(LETZTE, JSON.stringify(runde)); } catch (e) {}
        nr = 0;
        punkte = 0;
        uhrStarten();
        frage();
      }

      function frage() {
        if (vorbei) return;
        if (nr >= ANZAHL) return ende();
        var f = Q.fragen[runde[nr]];
        karte.innerHTML = '<div class="nummer">Frage ' + (nr + 1) + " von " + ANZAHL + "</div><h2></h2>" +
          '<div class="antworten"></div>';
        karte.querySelector("h2").textContent = f.frage;
        if (f.bild) {
          var img = document.createElement("img");
          img.className = "quizbild";
          img.alt = "Foto zur Frage";
          img.src = bildPfad(f);
          karte.insertBefore(img, karte.querySelector(".antworten"));
          if (f.quelle) {
            var q = document.createElement("div");
            q.className = "bildquelle";
            q.textContent = "Foto: " + f.quelle.urheber + ", " + f.quelle.lizenz + ", via Wikimedia Commons";
            karte.insertBefore(q, karte.querySelector(".antworten"));
          }
        }
        var box = karte.querySelector(".antworten");
        // Die erste Antwort im Pool ist die richtige, hier wird gemischt
        mischen(f.antworten.map(function (text, i) { return { text: text, richtig: i === 0 }; })).forEach(function (a) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "antwort";
          b.textContent = a.text;
          b.addEventListener("click", function () { waehlen(a.richtig, b, box); });
          box.appendChild(b);
        });
      }

      // Keine Rückmeldung, ob die Antwort stimmt: nur kurz markieren und weiter
      function waehlen(richtig, b, box) {
        if (box.dataset.fertig || vorbei) return;
        box.dataset.fertig = "1";
        if (nr === 0) Fortschritt.versuch("quiz"); // neue Runde zählt ab der ersten Antwort
        if (richtig) punkte++;
        b.classList.add("gewaehlt");
        setTimeout(function () { nr++; frage(); }, 350);
      }

      function ende() {
        clearInterval(uhr);
        var geschafft = punkte >= MINDESTENS;
        karte.innerHTML = '<div class="mitte">' +
          (geschafft
            ? '<div style="font-size:3rem" aria-hidden="true">👑</div><h2>Toll!</h2><p>' +
              (punkte === ANZAHL ? "Du hast alle Fragen richtig beantwortet." : "Du hast genug Fragen richtig beantwortet.") +
              " Eine wahre Kennerin der Königshäuser!</p>"
            : '<div style="font-size:3rem" aria-hidden="true">🍀</div><h2>Pech gehabt!</h2><p>Leider war nicht alles richtig. Nächstes Mal mehr Glück!</p>' +
              '<button class="knopf" type="button" id="nochmal">Noch einmal</button>') +
          "</div>";
        if (geschafft) setTimeout(function () { Fortschritt.gewinnen("quiz"); }, 900);
        else document.getElementById("nochmal").addEventListener("click", start);
      }

      karte.innerHTML = '<p class="mitte leise">Fragen werden geladen …</p>';
      bilderPruefen().then(function (liste) {
        verfuegbar = liste;
        ANZAHL = Math.min(Object.keys(QUOTE).reduce(function (s, b) { return s + QUOTE[b]; }, 0), verfuegbar.length);
        MINDESTENS = Math.min(Q.mindestensRichtig || ANZAHL, ANZAHL);
        document.getElementById("regel").textContent =
          "Beantworte " + ANZAHL + " Fragen rund um die Königshäuser der Welt. Ob eine Antwort stimmt, erfährst du erst am Ende. " +
          (MINDESTENS === ANZAHL ? "Nur wenn alle richtig sind, ist die Quest gelöst." : "Mindestens " + MINDESTENS + " müssen richtig sein.");
        start();
      });
    })();
  </script>
</body>
</html>
