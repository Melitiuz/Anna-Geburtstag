<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Hintergrund für das 2 x 2 Feld: Abendhimmel (Sonne links im Westen), Berge im oberen Viertel, grüne Wiese -->
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8cfa6"/>
      <stop offset=".28" stop-color="#f0b0a0"/>
      <stop offset=".55" stop-color="#d4abbd"/>
      <stop offset=".8" stop-color="#b3aed0"/>
      <stop offset="1" stop-color="#9ea9cf"/>
    </linearGradient>
    <linearGradient id="himmel-oben" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7fb0" stop-opacity=".3"/>
      <stop offset=".7" stop-color="#2e2f5a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sonnenschein" cx="0.1" cy="0.27" r="0.45">
      <stop offset="0" stop-color="#fff0cf" stop-opacity=".8"/>
      <stop offset=".25" stop-color="#ffd2a6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffc9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="berge-fern" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9b0aa"/>
      <stop offset=".5" stop-color="#b3a3bf"/>
      <stop offset="1" stop-color="#959cc0"/>
    </linearGradient>
    <linearGradient id="berge-nah" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8959a"/>
      <stop offset=".5" stop-color="#8f88a6"/>
      <stop offset="1" stop-color="#77809f"/>
    </linearGradient>
    <linearGradient id="wiese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fae55"/>
      <stop offset=".35" stop-color="#6aa24a"/>
      <stop offset="1" stop-color="#4c8a3a"/>
    </linearGradient>
    <linearGradient id="huegel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fae4e"/>
      <stop offset=".5" stop-color="#5f9246"/>
      <stop offset="1" stop-color="#4a7d44"/>
    </linearGradient>
    <radialGradient id="abendlicht" cx="0" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffd6ad" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffd6ad" stop-opacity="0"/>
    </radialGradient>
    <filter id="weich"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Himmel -->
  <rect width="400" height="130" fill="url(#himmel)"/>
  <rect width="400" height="130" fill="url(#himmel-oben)"/>
  <rect width="400" height="400" fill="url(#sonnenschein)"/>
  <!-- untergehende Sonne links -->
  <circle cx="44" cy="98" r="20" fill="#ffe6bf"/>
  <circle cx="44" cy="98" r="28" fill="#fff1d8" opacity=".3" filter="url(#weich)"/>
  <!-- Wolkenstreifen im Abendlicht -->
  <g fill="#fff3ec" opacity=".6">
    <path d="M70 34 Q110 26 150 33 Q125 39 95 39 Q78 38 70 34 Z"/>
    <path d="M160 52 Q205 44 250 51 Q215 57 185 57 Q168 56 160 52 Z" opacity=".7"/>
    <path d="M20 60 Q48 54 80 60 Q55 64 35 64 Q24 63 20 60 Z"/>
    <path d="M280 24 Q320 18 360 24 Q330 29 305 29 Q288 28 280 24 Z" opacity=".45"/>
  </g>

  <!-- Berge im oberen Viertel: ferne Kette, dann nähere -->
  <path d="M0 96 L28 78 L52 88 L84 58 L108 74 L132 62 L160 80 L196 48 L224 70 L250 60 L282 82 L318 52 L348 72 L372 64 L400 78 V120 H0 Z" fill="url(#berge-fern)"/>
  <!-- Schnee und Licht von links auf den Gipfeln -->
  <path d="M84 58 L76 64 L83 63 L88 67 L92 61 Z M196 48 L187 56 L195 54 L200 59 L205 53 Z M318 52 L309 60 L317 58 L322 63 L327 57 Z" fill="#f4e4e0" opacity=".8"/>
  <path d="M0 108 L40 86 L70 98 L104 76 L140 96 L178 82 L214 100 L252 80 L290 98 L330 84 L366 100 L400 90 V130 H0 Z" fill="url(#berge-nah)"/>
  <path d="M104 76 L96 84 L104 82 Z M252 80 L244 88 L252 86 Z" fill="#f4d6c8" opacity=".5"/>

  <!-- Hügel und Wiese -->
  <path d="M0 122 Q60 106 130 116 Q210 126 280 112 Q340 102 400 114 V140 H0 Z" fill="url(#huegel)"/>
  <path d="M0 132 Q100 122 200 130 Q300 138 400 126 V400 H0 Z" fill="url(#wiese)"/>
  <!-- Bäume am Waldrand in der Ferne -->
  <g fill="#3f6e3a" opacity=".8">
    <path d="M300 116 l5 -14 l5 14 Z M312 118 l4 -11 l4 11 Z M322 115 l5 -15 l5 15 Z M352 112 l4 -12 l4 12 Z"/>
    <circle cx="70" cy="114" r="6"/><circle cx="80" cy="112" r="7"/><circle cx="90" cy="115" r="5"/>
  </g>
  <!-- Abendlicht auf der Wiese von links -->
  <rect y="120" width="400" height="280" fill="url(#abendlicht)"/>
  <!-- Grasbüschel -->
  <g stroke="#3d7a32" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M30 180 l3 -8 M34 180 l0 -10 M38 180 l-2 -8"/>
    <path d="M140 160 l3 -7 M144 160 l0 -9 M148 160 l-2 -7"/>
    <path d="M260 175 l3 -8 M264 175 l0 -10 M268 175 l-2 -8"/>
    <path d="M360 160 l3 -7 M364 160 l0 -9 M368 160 l-2 -7"/>
    <path d="M90 250 l3 -9 M95 250 l0 -11 M100 250 l-2 -9"/>
    <path d="M210 230 l3 -9 M215 230 l0 -11 M220 230 l-2 -9"/>
    <path d="M330 260 l3 -9 M335 260 l0 -11 M340 260 l-2 -9"/>
    <path d="M40 330 l3 -10 M46 330 l0 -12 M52 330 l-2 -10"/>
    <path d="M170 340 l3 -10 M176 340 l0 -12 M182 340 l-2 -10"/>
    <path d="M300 350 l3 -10 M306 350 l0 -12 M312 350 l-2 -10"/>
    <path d="M380 300 l3 -10 M386 300 l0 -12"/>
  </g>
  <!-- ein paar Wiesenblumen -->
  <g>
    <circle cx="60" cy="200" r="2.4" fill="#fff5d6"/><circle cx="120" cy="290" r="2.4" fill="#f7d36a"/>
    <circle cx="240" cy="200" r="2.2" fill="#fff5d6"/><circle cx="290" cy="300" r="2.4" fill="#f7d36a"/>
    <circle cx="350" cy="220" r="2.2" fill="#fff5d6"/><circle cx="20" cy="270" r="2.2" fill="#f7d36a"/>
    <circle cx="200" cy="370" r="2.4" fill="#fff5d6"/><circle cx="380" cy="380" r="2.2" fill="#f7d36a"/>
  </g>
</svg>
