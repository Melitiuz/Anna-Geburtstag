<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Du hast es geschafft!</title>
  <link rel="stylesheet" href="../css/stil.css">
  <style>
    .brief { text-align: center; padding: 28px 22px; }
    .brief .gross { font-size: 4rem; line-height: 1; margin-bottom: 12px; }
    .brief p { font-size: 1.1rem; }
    .brief .gruss { margin-top: 20px; font-style: italic; color: var(--text-leise); }
  </style>
</head>
<body>
  <main class="seite">
    <!--
      Diese Seite darf jederzeit inhaltlich geändert werden.
      Der Pfad (Ordner "ziel") darf sich nach dem Erzeugen des QR Codes nie mehr ändern.
    -->
    <article class="karte brief">
      <div class="gross" aria-hidden="true">🎁</div>
      <h1>Herzlichen Glückwunsch!</h1>

      <!-- Geburtstagstext hier eintragen -->
      <p>Du hast alle vier Spiele gemeistert und den Code geknackt. Ich wünsche dir einen wunderschönen Geburtstag voller Freude und Überraschungen.</p>
      <p>Dein Geschenk wartet hier auf dich:</p>

      <!-- Link zum Ort des Geschenks hier eintragen -->
      <p style="margin-top:20px">
        <a class="knopf" href="https://example.com" target="_blank" rel="noopener">Zum Geschenk</a>
      </p>

      <p class="gruss">Alles Liebe</p>
    </article>
  </main>

  <script src="../js/fortschritt.js"></script>
  <script>Fortschritt.konfetti();</script>
</body>
</html>
